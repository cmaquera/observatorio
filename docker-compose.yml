services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: observatorio_backend
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - observatorio_data:/app/data
    networks:
      - observatorio_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: observatorio_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - observatorio_net

volumes:
  observatorio_data:
    name: observatorio_data

networks:
  observatorio_net:
    driver: bridge
